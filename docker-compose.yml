version: '3.8'

services:
  # Aplicación PHP
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - biblioteca
    depends_on:
      - db

  # Servidor Web Nginx
  web:
    image: nginx:alpine
    container_name: biblioteca_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - biblioteca
    depends_on:
      - app

  # Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: biblioteca_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: biblioteca
      MYSQL_USER: biblioteca
      MYSQL_PASSWORD: biblioteca123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - biblioteca

  # Node.js para compilar assets
  node:
    image: node:20-alpine
    container_name: biblioteca_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: tail -f /dev/null
    networks:
      - biblioteca

  # phpMyAdmin (opcional, para gestionar la BD)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: biblioteca_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    networks:
      - biblioteca
    depends_on:
      - db

networks:
  biblioteca:
    driver: bridge

volumes:
  db_data:
